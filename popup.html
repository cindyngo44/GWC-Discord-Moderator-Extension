<!DOCTYPE html>
<html>

<head>
  <title>GWC Template Copier</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <h3>GWC Template Copier</h3>


  <!-- ========================= -->
  <!-- TABS -->
  <!-- ========================= -->

  <div class="tabs">

    <button
      class="tab-btn active"
      data-tab="role-assignment"
    >
      Role Assignment
    </button>

    <button
      class="tab-btn"
      data-tab="discord-messages"
    >
      Discord Messages
    </button>

    <button
      class="tab-btn"
      data-tab="emails"
    >
      Emails
    </button>

  </div>


  <!-- ========================= -->
  <!-- STUDENT NAME -->
  <!-- ========================= -->

  <div class="section">

    <label for="studentName">
      Student Name:
    </label>

    <input
      type="text"
      id="studentName"
      placeholder="Autodetecting..."
    />

  </div>

  <!-- ========================= -->
  <!-- Email -->
  <!-- ========================= -->

  <div class="section">
    <label for="modEmail">
      Your Email:
    </label>

    <input
      type="email"
      id="modEmail"
      placeholder="Enter your email"
    />
  </div>

  <!-- ========================= -->
  <!-- ROLE ASSIGNMENT -->
  <!-- ========================= -->

  <div
    class="tab-content active"
    id="role-assignment"
  >

    <div class="section">

      <label>
        HQ Templates:
      </label>

      <div
        id="role-assignment-templates"
      >
        <p>
          Loading templates...
        </p>
      </div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- DISCORD MESSAGES -->
  <!-- ========================= -->

  <div
    class="tab-content"
    id="discord-messages"
  >

    <div class="section">

      <label>
        Discord Message Templates:
      </label>

      <div
        id="discord-message-templates"
      >
        <p>
          Loading templates...
        </p>
      </div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- EMAILS -->
  <!-- ========================= -->

  <div
    class="tab-content"
    id="emails"
  >

    <div class="section">

      <label>
        Email Templates:
      </label>

      <div
        id="email-templates"
      >
        <p>
          Loading templates...
        </p>

      </div>

    </div>

  </div>


  <!-- ========================= -->
  <!-- TOAST -->
  <!-- ========================= -->

  <div id="toast">
    Copied!
  </div>


  <script src="popup.js"></script>

</body>

</html>
